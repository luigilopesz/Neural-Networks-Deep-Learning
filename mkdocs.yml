site_name: Artificial Neural Networks & Deep Learning
site_author: Luigi Lopes
site_description: Coursework for Artificial Neural Networks & Deep Learning (Insper) - exercises and the ASIA-FLOOD next-day flood project.
site_url: https://luigilopesz.github.io/Neural-Networks-Deep-Learning
repo_url: https://github.com/luigilopesz/Neural-Networks-Deep-Learning
repo_name: luigilopesz/Neural-Networks-Deep-Learning

theme:
  name: material
  # Sans for the interface, headings and tables; the serif used for running text
  # is loaded in extra_css below and applied in stylesheets/site.css.
  font:
    text: Schibsted Grotesk
    code: JetBrains Mono
  # Colours are defined in stylesheets/site.css (one accent, light and dark).
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand
    - navigation.sections
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
  icon:
    logo: material/graph-outline
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/lightbulb
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/circle-xmark
      danger: fontawesome/solid/circle-exclamation
      bug: fontawesome/solid/bug
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - markdown_grid_tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: python
          class: python
          validator: !!python/name:markdown_exec.validator
          format: !!python/name:markdown_exec.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true  
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - tables
  - toc:
      permalink: true
      toc_depth: 3

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Local-only datasets: never copied into the built site
exclude_docs: |
  projects/data/
  projects/eda/sections/
  projects/eda/verification/
  exercises/data/code/data/
  exercises/vae/code/data/
  **/__pycache__/
  # unfilled course templates, not part of the delivery (re-add to `nav` and remove here when assigned)
  roteiro1/
  roteiro2/
  roteiro3/
  roteiro4/
  thisdocumentation/

plugins:
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      # Serial git calls instead of a multiprocessing.Pool. Same output, and it is the only
      # way `mkdocs build` works in a sandbox that forbids named pipes (WinError 5).
      enable_parallel_processing: false
  - git-authors:
      ignore_authors:
        - noreply@anthropic.com
  - git-committers:
      enabled: !ENV [CI, false]
      repository: luigilopesz/Neural-Networks-Deep-Learning
      branch: main
      exclude_committers:
        - claude
  - search
  - badges
  - minify:
      minify_html: true
  - markdown-exec
  - render_swagger:
      allow_arbitrary_locations : true
  - termynal:
      prompt_literal_start:
        - "$"
        - ">"

# mkdocs-jupyter
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      ignore:
        - "*/exercises/data/code/*.py"
        - "*/exercises/perceptron/code/*.py"
        - "*/exercises/mlp/code/*.py"
        - "*/exercises/vae/code/*.py"
        - "*/projects/*/code/*.py"

extra_javascript:
  # - https://polyfill.io/v3/polyfill.min.js?features=es6
  # One MathJax only (v3, matching javascripts/mathjax.js); a second unpinned copy used to load v4 alongside it
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  # Pinned: the figures in exercises/data are built against this major version.
  - https://fastly.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js

  # Para a implementação do mkdocs-jupyter
  - javascripts/mathjax.js

  # Figuras interativas (ECharts)
  - javascripts/charts.js
  - javascripts/charts/fig1.js
  - javascripts/charts/fig2.js
  - javascripts/charts/fig3.js
  - javascripts/charts/fig4.js
  - javascripts/charts/fig5.js
  - javascripts/charts/fig6.js

extra_css:
  # Running-text serif (the sans and mono come from theme.font). Variable optical-size axis.
  - "https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap"
  - stylesheets/charts.css
  - stylesheets/site.css

nav:
  - Overview: index.md
  - Exercises:
    - Data: ./exercises/data/index.md
    - Perceptron: ./exercises/perceptron/index.md
    - MLP: ./exercises/mlp/index.md
    - VAE: ./exercises/vae/index.md
  - Projects:
    - Project brief: ./projects/index.md
    - EDA: ./projects/eda/index.md
